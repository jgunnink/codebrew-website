<!DOCTYPE html>
<html>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono&display=swap"
    rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #F4F3EF;
      /* Your Bone background */
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 2rem;
      /* Scaled up gap */
      transform: scale(4);
      /* Scales the logo up 400% for high-res capture */
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: #1C1B1A;
      font-size: 1.4rem;
      line-height: 0.85;
      margin: 0;
    }

    .mono {
      font-family: 'Space Mono', monospace;
      color: #888;
      font-size: 0.65rem;
      margin-top: 0.3rem;
    }
  </style>
</head>

<body>

  <div class="brand-lockup">
    <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"
      style="flex-shrink: 0;">
      <path d="M 17 20 L 23 8 M 25 20 L 31 8" stroke="#B85038" stroke-width="2.5" stroke-linecap="square" />
      <path d="M 10 18 L 10 34 L 32 34 L 32 18" stroke="#1C1B1A" stroke-width="2.5" stroke-linecap="square"
        stroke-linejoin="miter" />
      <path d="M 15 24 L 18 26.5 L 15 29" stroke="#1C1B1A" stroke-width="2" stroke-linecap="square"
        stroke-linejoin="miter" />
      <line x1="21" y1="29" x2="27" y2="29" stroke="#1C1B1A" stroke-width="2" />
    </svg>

    <div style="display: flex; flex-direction: column; justify-content: center; transform: translateY(2px);">
      <span class="brand">CODE BREW</span>
      <span class="mono">// STUDIO</span>
    </div>
  </div>

</body>

</html>
